{% extends "base.html" %}

{% block title %}概览 - Backtest Dashboard{% endblock %}
{% block page_title %}概览{% endblock %}

{% block content %}
<section class="metric-grid">
  {% for item in data.summary_metrics %}
    <article class="metric-card">
      <div class="metric-label">{{ item.label }}</div>
      <div class="metric-value">{{ item.value }}</div>
    </article>
  {% endfor %}
</section>

<section class="panel">
  <div class="panel-header">
    <h2>净值预览</h2>
    <a class="text-link" href="/ui/backtests/current/nav">查看完整净值</a>
  </div>
  <div class="chart-box" data-chart='{{ data.nav|tojson }}'></div>
</section>
{% endblock %}
