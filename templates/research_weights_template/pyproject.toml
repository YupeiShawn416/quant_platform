[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-research-template"
version = "0.1.0"
description = "Client research template for quant_platform weights packages"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]
